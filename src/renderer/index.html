<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>L</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; font: 14px/1.42 'Segoe UI', sans-serif; }
  #me { position: absolute; left: 0; top: 0; width: 280px; height: 240px; will-change: transform; pointer-events: none; }
  #talk { position: absolute; width: 310px; display: none; flex-direction: column; gap: 6px; }
  #bubble { display: none; background: #fbfbf8; color: #15131a; border: 1.5px solid #15131a; border-radius: 4px; padding: 9px 12px; white-space: pre-wrap; max-height: 42vh; overflow: auto; box-shadow: 3px 3px 0 rgba(21, 19, 26, .85); user-select: text; }
  #bubble small { display: block; margin-top: 5px; font-size: 11px; color: #68646f; }
  #bubble.thinking { color: #68646f; font-style: italic; }
  #entry { display: none; align-items: center; background: #fbfbf8; border: 1.5px solid #15131a; border-radius: 4px; box-shadow: 3px 3px 0 rgba(21, 19, 26, .85); }
  #entry b { font: 22px/1 'Old English Text MT', 'Times New Roman', serif; padding: 5px 4px 5px 10px; color: #15131a; }
  .sugar { position: absolute; left: 0; top: 0; width: 13px; height: 13px; background: #fdfdfb; border: 1px solid #6b6a75; box-shadow: 3px -3px 0 -1px #e9e8e3, 3px -3px 0 0 #6b6a75; pointer-events: none; will-change: transform; }
  #bubble .choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; white-space: normal; }
  #bubble .choices button { font: 12.5px 'Segoe UI', sans-serif; color: #15131a; background: #fff; border: 1.5px solid #15131a; border-radius: 3px; padding: 3px 10px; cursor: pointer; box-shadow: 2px 2px 0 rgba(21, 19, 26, .8); transition: transform .08s, box-shadow .08s; }
  #bubble .choices button:hover { background: #15131a; color: #fbfbf8; }
  #bubble .choices button:active { transform: translate(2px, 2px); box-shadow: 0 0 0 rgba(21, 19, 26, .8); }
  #entry input { flex: 1; min-width: 0; border: 0; outline: 0; padding: 8px; background: transparent; font: inherit; color: #15131a; }
</style>
</head>
<body>
<canvas id="me"></canvas>
<div id="talk">
  <div id="bubble"></div>
  <div id="entry"><b>L</b><input id="input" placeholder="Dis-moi.  (clic droit sur moi : tout le reste)" spellcheck="false" autocomplete="off"></div>
</div>
<script src="body.js"></script>
<script src="l.js"></script>
</body>
</html>
